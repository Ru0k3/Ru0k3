<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Rama Krishna GitHub profile banner</title>
  <desc id="desc">A sharp responsive profile banner with an avatar, profile details, and technology interests.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891B2"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <clipPath id="avatarClip">
      <rect x="42" y="72" width="500" height="470" rx="16"/>
    </clipPath>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1398" height="618" rx="16" fill="#FFFFFF" stroke="#0891B2" stroke-width="2"/>
  <rect x="20" y="20" width="1360" height="580" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-opacity="0.35"/>

  <rect x="42" y="72" width="500" height="470" rx="16" fill="#FFFFFF" stroke="url(#accent)" stroke-width="3" filter="url(#softShadow)"/>
  <!-- Use the 460px PNG directly; do not embed or upscale the old 320px JPEG. -->
  <image href="https://raw.githubusercontent.com/Ru0k3/Ru0k3/main/profile-avatar.png"
         x="62" y="82" width="460" height="460"
         preserveAspectRatio="xMidYMid meet"
         clip-path="url(#avatarClip)"
         style="image-rendering:auto"/>

  <rect x="600" y="58" width="740" height="500" rx="12" fill="none" stroke="#94A3B8" stroke-opacity="0.35"/>
  <text x="626" y="48" fill="#0891B2" font-family="Consolas,Menlo,monospace" font-size="14">Rama Krishna@github</text>
  <circle cx="1308" cy="44" r="5" fill="#059669"/>

  <g fill="#64748B" font-family="Consolas,Menlo,monospace" font-size="14">
    <text x="626" y="94"><tspan fill="#0891B2">Role</tspan><tspan> ...................................... Student</tspan></text>
    <text x="626" y="122"><tspan fill="#0891B2">Origin</tspan><tspan> .................................... Amritapuri</tspan></text>
    <text x="626" y="150"><tspan fill="#0891B2">Status</tspan><tspan> .................................... Go with the flow</tspan></text>
    <text x="626" y="206"><tspan fill="#0891B2">Core.Backend</tspan><tspan> .......................... JavaScript, Java, Go</tspan></text>
    <text x="626" y="234"><tspan fill="#0891B2">Core.Database</tspan><tspan> .......................... PostgreSQL, MySQL, Supabase</tspan></text>
    <text x="626" y="262"><tspan fill="#0891B2">Core.Infra</tspan><tspan> ............................. Google Cloud, Fly.io, AWS</tspan></text>
    <text x="626" y="318"><tspan fill="#0891B2">Portfolio</tspan><tspan> .............................. ru0k3.github.io/portfolio</tspan></text>
    <text x="626" y="346"><tspan fill="#0891B2">Education</tspan><tspan> .............................. Amrita Vishwa Vidyapeetham</tspan></text>
    <text x="626" y="374"><tspan fill="#0891B2">Interests</tspan><tspan> .............................. CTFs, AI models, device tinkering</tspan></text>
  </g>

  <text x="626" y="468" fill="#64748B" font-family="Consolas,Menlo,monospace" font-size="14">&gt; More about me &amp; projects below in README <tspan fill="#0891B2">█</tspan></text>
  <rect x="1310" y="500" width="8" height="18" rx="2" fill="#0891B2"/>
</svg>
