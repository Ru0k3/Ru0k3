name: Update Profile Stats

on:
  schedule:
    - cron: "31 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate live stats badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile_stats.py

      - name: Commit daily stats if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-stats.svg profile-stats.json
          if git diff --cached --quiet; then
            echo "No stats changes detected."
            exit 0
          fi
          git commit -m "Daily refresh of profile stats [skip ci]"
          git push
