name: Update Profile Assets

on:
  # Check for a changed GitHub profile avatar twice per day.
  schedule:
    - cron: "17 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check Pillow CairoSVG

      - name: Refresh avatar and banner assets
        env:
          AVATAR_URL: https://github.com/${{ github.repository_owner }}.png?size=460
        run: python scripts/update_profile_assets.py "$AVATAR_URL"

      - name: Commit changed profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-avatar.png light_mode.svg dark_mode.svg light_mode.png dark_mode.png
          if git diff --cached --quiet; then
            echo "No profile asset changes detected."
            exit 0
          fi
          git commit -m "Auto-update profile avatar and banners [skip ci]"
          git push
